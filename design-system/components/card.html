<!--
  Canonical card + badge + stat. /design-import replaces or extends the files
  in this directory with the components exported from Claude Design.
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:24px; font-family:var(--font-sans); background:var(--color-bg);">
  <div class="card">
    <span class="badge">Feature</span>
    <h3 style="margin-top:12px;">Fast onboarding</h3>
    <p>Teams are productive on day one — no training sessions required.</p>
  </div>
  <div class="card">
    <div class="stat">
      <span class="stat-value">98.2%</span>
      <span class="stat-label">Customer satisfaction, FY2026</span>
    </div>
  </div>
</div>

<!-- @dsCard group="Slides" name="Chart" subtitle="折れ線3系列・直接ラベル" width="1280" height="720" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart — Google Core Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* Tokens below mirror ../tokens.css (inlined so this file is self-contained).
   Sizes are authored in cqw against the 1920px-wide base canvas: 1cqw = 19.2px. */
:root {
  --g-blue-500:#4285F4; --g-red-500:#EA4335; --g-yellow-500:#FBBC04; --g-green-500:#34A853;
  --g-blue-50:#E8F0FE; --g-blue-200:#AECBFA; --g-blue-600:#1A73E8; --g-blue-900:#174EA6;
  --g-red-50:#FCE8E6; --g-red-600:#D93025; --g-red-900:#A50E0E;
  --g-yellow-50:#FEF7E0; --g-yellow-700:#F29900; --g-yellow-800:#EA8600;
  --g-green-50:#E6F4EA; --g-green-600:#1E8E3E; --g-green-700:#188038;
  --g-grey-50:#F8F9FA; --g-grey-100:#F1F3F4; --g-grey-200:#E8EAED; --g-grey-300:#DADCE0;
  --g-grey-400:#BDC1C6; --g-grey-500:#9AA0A6; --g-grey-600:#80868B; --g-grey-700:#5F6368;
  --g-grey-800:#3C4043; --g-grey-900:#202124;
  --font-sans:"Google Sans","Google Sans Text",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:var(--font-sans);
  background:var(--g-grey-200);
  padding:48px 24px;
}
.deck { max-width:1280px; margin:0 auto; display:flex; flex-direction:column; gap:40px; }
.frame-label { font-size:13px; color:var(--g-grey-700); margin-bottom:8px; }

/* --- Slide canvas --------------------------------------------------------- */
.slide {
  aspect-ratio:16/9;
  container-type:inline-size;
  background:var(--surface,#fff);
  border-radius:8px;
  overflow:hidden;
  position:relative;
  box-shadow:0 1px 3px rgba(60,64,67,.15);
  /* semantic roles, light slide */
  --surface:#FFFFFF; --surface-alt:var(--g-grey-50);
  --ink:var(--g-grey-900); --ink-secondary:var(--g-grey-700); --ink-muted:var(--g-grey-500);
  --hairline:var(--g-grey-300);
  --accent:var(--g-blue-500); --accent-text:var(--g-blue-600); --accent-wash:var(--g-blue-50);
  --chart-1:#4285F4; --chart-2:#EA4335; --chart-3:#EA8600;
  --chart-4:#1E8E3E; --chart-5:#174EA6; --chart-6:#A50E0E;
  color:var(--ink);
}
.slide[data-theme="dark"] {
  --surface:var(--g-grey-900); --surface-alt:var(--g-grey-800);
  --ink:#FFFFFF; --ink-secondary:var(--g-grey-300); --ink-muted:var(--g-grey-500);
  --hairline:var(--g-grey-800);
  --accent-text:var(--g-blue-200); --accent-wash:var(--g-grey-800);
  --chart-1:#4285F4; --chart-2:#EA4335; --chart-3:#D08000;
  --chart-4:#34A853; --chart-5:#1A73E8; --chart-6:#D93025;
}
.accent-blue   { --accent:var(--g-blue-500);   --accent-text:var(--g-blue-600);   --accent-wash:var(--g-blue-50); }
.accent-red    { --accent:var(--g-red-500);    --accent-text:var(--g-red-600);    --accent-wash:var(--g-red-50); }
.accent-yellow { --accent:var(--g-yellow-500); --accent-text:var(--g-yellow-800); --accent-wash:var(--g-yellow-50); }
.accent-green  { --accent:var(--g-green-500);  --accent-text:var(--g-green-600);  --accent-wash:var(--g-green-50); }

/* margin frame: 96px at 1920 = 5cqw */
.pad { position:absolute; inset:0; padding:5cqw; display:flex; flex-direction:column; }

/* --- Type roles (px @1920 → cqw) ------------------------------------------ */
.display  { font-size:5cqw;      font-weight:400; line-height:1.1;  letter-spacing:-0.01em; }
.headline { font-size:2.8125cqw; font-weight:400; line-height:1.15; }
.subtitle { font-size:1.667cqw;  font-weight:400; line-height:1.4; color:var(--ink-secondary); }
.body     { font-size:1.458cqw;  font-weight:400; line-height:1.5; }
.kicker   { font-size:1.146cqw;  font-weight:500; line-height:1.2; color:var(--accent-text); }
.caption  { font-size:0.9375cqw; font-weight:400; line-height:1.4; color:var(--ink-secondary); }
.stat     { font-size:10.4cqw;   font-weight:400; line-height:1;   color:var(--accent-text); letter-spacing:-0.02em; }

/* --- Shared pieces --------------------------------------------------------- */
.dots { display:flex; gap:0.833cqw; }
.dots i { width:1.25cqw; height:1.25cqw; border-radius:50%; }
.dots i:nth-child(1){background:var(--g-blue-500)} .dots i:nth-child(2){background:var(--g-red-500)}
.dots i:nth-child(3){background:var(--g-yellow-500)} .dots i:nth-child(4){background:var(--g-green-500)}

.footer {
  position:absolute; left:5cqw; right:5cqw; bottom:2cqw;
  display:flex; justify-content:space-between; align-items:center;
}
.card {
  background:var(--surface-alt); border-radius:1.25cqw; padding:2.5cqw;
}
.chip {
  display:inline-block; border-radius:999px; padding:0.4cqw 1.1cqw;
  font-size:0.9375cqw; font-weight:500; background:var(--accent-wash); color:var(--accent-text);
}

/* =========================================================================
   1. Title
   ========================================================================= */
.s-title .pad { justify-content:center; gap:2.5cqw; }
.s-title .meta { display:flex; gap:1.667cqw; align-items:center; }

/* quarter-circle background shape: the only element allowed past the margin */
.corner-shape {
  position:absolute; right:-9cqw; bottom:-9cqw; width:24cqw; height:24cqw;
  border-radius:50%; background:var(--g-blue-50);
}
.corner-shape::after {
  content:""; position:absolute; inset:5.2cqw; border-radius:50%; background:var(--g-blue-200);
}

/* =========================================================================
   2. Agenda
   ========================================================================= */
.s-agenda .pad { flex-direction:row; gap:3.33cqw; }
.s-agenda .left { flex:0 0 34%; display:flex; flex-direction:column; gap:1.25cqw; }
.agenda-list { flex:1; display:flex; flex-direction:column; justify-content:center; }
.agenda-list li {
  list-style:none; display:flex; gap:2cqw; align-items:baseline;
  padding:1.35cqw 0; border-bottom:1px solid var(--hairline);
}
.agenda-list li:last-child { border-bottom:none; }
.agenda-list .num { font-size:1.667cqw; color:var(--accent-text); font-weight:500; min-width:2.5cqw; }

/* =========================================================================
   3. Section divider
   ========================================================================= */
.s-divider { background:var(--g-blue-500); }
.s-divider .pad { justify-content:flex-end; gap:1.25cqw; }
.s-divider .headline, .s-divider .subtitle { color:#fff; }
.s-divider .subtitle { opacity:.85; }
.s-divider .big-num {
  position:absolute; top:-6cqw; right:2cqw; font-size:26cqw; font-weight:400;
  color:rgba(255,255,255,.18); line-height:1;
}

/* =========================================================================
   4. Content (heading + bullets)
   ========================================================================= */
.head-block { display:flex; flex-direction:column; gap:0.833cqw; margin-bottom:2.5cqw; }
.bullets { display:flex; flex-direction:column; gap:1.667cqw; max-width:72%; }
.bullets li { list-style:none; display:flex; gap:1.25cqw; align-items:flex-start; }
.bullets li::before {
  content:""; flex:0 0 auto; width:0.73cqw; height:0.73cqw; border-radius:50%;
  background:var(--accent); margin-top:0.68cqw;
}

/* =========================================================================
   5. Two-column
   ========================================================================= */
.cols { display:flex; gap:1.667cqw; flex:1; }
.cols .card { flex:1; display:flex; flex-direction:column; gap:1.25cqw; }
.card-head { display:flex; align-items:center; gap:0.833cqw; }
.card-head i { width:1cqw; height:1cqw; border-radius:50%; background:var(--accent); }
.card ul { display:flex; flex-direction:column; gap:0.833cqw; }
.card li { list-style:none; color:var(--ink); }

/* =========================================================================
   6. Big stat
   ========================================================================= */
.s-stat .hero { display:flex; align-items:baseline; gap:1.667cqw; margin:auto 0; }
.stat-row { display:flex; gap:1.667cqw; }
.stat-tile { flex:1; border-top:1px solid var(--hairline); padding-top:1.25cqw; }
.stat-tile .v { font-size:3.125cqw; font-weight:400; }
.stat-tile:nth-child(1) .v { color:var(--g-blue-600); }
.stat-tile:nth-child(2) .v { color:var(--g-red-600); }
.stat-tile:nth-child(3) .v { color:var(--g-green-600); }

/* =========================================================================
   7. Chart
   ========================================================================= */
.legend { display:flex; gap:2cqw; margin-bottom:1.25cqw; }
.legend span { display:flex; align-items:center; gap:0.6cqw; font-size:0.9375cqw; color:var(--ink-secondary); }
.legend i { width:0.9cqw; height:0.9cqw; border-radius:50%; }
.chart-wrap { flex:1; min-height:0; }
.chart-wrap svg { width:100%; height:100%; display:block; overflow:visible; }

/* =========================================================================
   8. Quote
   ========================================================================= */
.s-quote .pad { justify-content:center; gap:2cqw; }
.quote-mark { font-size:9cqw; line-height:.6; color:var(--g-yellow-500); font-weight:700; }
.quote-text { font-size:2.8125cqw; font-weight:400; line-height:1.35; max-width:80%; }

/* =========================================================================
   9. Table
   ========================================================================= */
table { width:100%; border-collapse:collapse; font-size:1.25cqw; }
thead th {
  background:var(--surface-alt); color:var(--ink-secondary); font-weight:500;
  text-align:left; padding:1cqw 1.25cqw;
}
thead th:first-child { border-radius:0.8cqw 0 0 0.8cqw; }
thead th:last-child  { border-radius:0 0.8cqw 0.8cqw 0; }
tbody td { padding:1.1cqw 1.25cqw; border-bottom:1px solid var(--g-grey-200); }
tbody tr:last-child td { border-bottom:none; }
td .yes { color:var(--g-green-700); font-weight:500; }
td .no  { color:var(--ink-muted); }

/* =========================================================================
   10. Closing (dark)
   ========================================================================= */
.s-closing .pad { justify-content:center; align-items:flex-start; gap:2.5cqw; }

body { padding:0; background:#fff; }
.deck-one { max-width:none; }
.slide { border-radius:0; box-shadow:none; width:100%; }
</style>
</head>
<body>
<main class="deck-one">
<div class="slide">
      <div class="pad">
        <div class="head-block" style="margin-bottom:1.25cqw;">
          <p class="kicker" style="color:var(--g-blue-600)">利用データ</p>
          <h2 class="headline">プラン別の月間アクティブチーム数</h2>
        </div>
        <div class="legend">
          <span><i style="background:var(--chart-1)"></i>Enterprise</span>
          <span><i style="background:var(--chart-2)"></i>Business</span>
          <span><i style="background:var(--chart-3)"></i>Starter</span>
        </div>
        <div class="chart-wrap">
          <!-- Line chart, 3 series. Slot 3 (#EA8600) is sub-3:1 on white →
               relief rule: every series carries a direct end label + value. -->
          <svg viewBox="0 0 1600 560" role="img" aria-label="プラン別の月間アクティブチーム数の推移(1月から6月)">
            <!-- gridlines + y labels -->
            <g stroke="#E8EAED" stroke-width="1.5">
              <line x1="80" y1="60"  x2="1420" y2="60"/>
              <line x1="80" y1="210" x2="1420" y2="210"/>
              <line x1="80" y1="360" x2="1420" y2="360"/>
            </g>
            <line x1="80" y1="510" x2="1420" y2="510" stroke="#BDC1C6" stroke-width="2"/>
            <g font-size="26" fill="#5F6368" font-family="inherit">
              <text x="64" y="68"  text-anchor="end">15k</text>
              <text x="64" y="218" text-anchor="end">10k</text>
              <text x="64" y="368" text-anchor="end">5k</text>
              <text x="64" y="518" text-anchor="end">0</text>
              <text x="80"   y="552">1月</text>
              <text x="348"  y="552">2月</text>
              <text x="616"  y="552">3月</text>
              <text x="884"  y="552">4月</text>
              <text x="1152" y="552">5月</text>
              <text x="1420" y="552" text-anchor="end">6月</text>
            </g>
            <!-- series 1: Enterprise 6.2→7.0→7.8→8.9→10.1→11.4k -->
            <polyline fill="none" stroke="#4285F4" stroke-width="5" stroke-linejoin="round"
              points="80,324 348,300 616,276 884,243 1152,207 1420,168"/>
            <!-- series 2: Business 4.0→4.4→4.6→5.1→5.6→6.0k -->
            <polyline fill="none" stroke="#EA4335" stroke-width="5" stroke-linejoin="round"
              points="80,390 348,378 616,372 884,357 1152,342 1420,330"/>
            <!-- series 3: Starter 2.6→2.8→3.1→3.2→3.5→3.7k -->
            <polyline fill="none" stroke="#EA8600" stroke-width="5" stroke-linejoin="round"
              points="80,432 348,426 616,417 884,414 1152,405 1420,399"/>
            <!-- end markers: 2px white ring separates overlapping marks -->
            <g stroke="#fff" stroke-width="3">
              <circle cx="1420" cy="168" r="10" fill="#4285F4"/>
              <circle cx="1420" cy="330" r="10" fill="#EA4335"/>
              <circle cx="1420" cy="399" r="10" fill="#EA8600"/>
            </g>
            <!-- direct end labels: text in ink, identity by position -->
            <g font-size="28" fill="#202124" font-family="inherit">
              <text x="1444" y="176" font-weight="500">Enterprise 11.4k</text>
              <text x="1444" y="338" font-weight="500">Business 6.0k</text>
              <text x="1444" y="407" font-weight="500">Starter 3.7k</text>
            </g>
          </svg>
        </div>
      </div>
      <div class="footer caption"><span>出典: 社内ダッシュボード、2026年6月</span><span>7</span></div>
    </div>
</main>
</body>
</html>

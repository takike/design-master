<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TEMPLATE CONTRACT (export scripts depend on these):
     1. <meta name="doc-type" content="document">
     2. Each printed page is a <section class="page"> sized to A4; content
        must fit inside it (overflow is clipped by design — verify fit!).
     3. Replace the #design-tokens block with the CURRENT contents of
        design-system/tokens.css when generating.
     Per-document styling goes in #doc-styles. -->
<meta name="doc-type" content="document">
<title>design-master sample one-pager</title>
<style id="design-tokens">
/* INLINE design-system/tokens.css HERE (current version below) */
:root {
  --color-bg: #fafaf9;
  --color-surface: #ffffff;
  --color-text: #1c1917;
  --color-text-muted: #57534e;
  --color-primary: #4338ca;
  --color-primary-contrast: #ffffff;
  --color-accent: #d97706;
  --color-border: #e7e5e4;
  --color-success: #15803d;
  --color-warning: #b45309;
  --color-danger: #b91c1c;
  --font-sans: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
  --font-display: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Noto Sans Mono', monospace;
  --text-xs: 12px; --text-sm: 14px; --text-base: 16px; --text-lg: 20px;
  --text-xl: 25px; --text-2xl: 31px; --text-3xl: 39px; --text-4xl: 49px; --text-5xl: 61px;
  --space-0: 0; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px; --space-24: 96px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.06);
  --shadow-md: 0 2px 8px rgba(28, 25, 23, 0.08);
  --shadow-lg: 0 8px 24px rgba(28, 25, 23, 0.12);
}
</style>
<style id="page-engine">
/* Page engine — do not edit. Screen: paper preview on gray. Print: exact A4. */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.page {
  width: 210mm; height: 297mm;
  overflow: hidden;
  position: relative;
  background: var(--color-surface);
  color: var(--color-text);
  font-family: var(--font-sans);
}
@media screen {
  body { background: #e4e4e7; padding: 32px 0; }
  .page { margin: 0 auto 32px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); }
}
@media print {
  @page { size: A4; margin: 0; }
  body { background: none; }
  .page { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }
}
/* Never use vh/vw units inside .page — they break in print. */
</style>
<style id="doc-styles">
/* Per-document styles. Build on the tokens. */
.page { padding: 18mm; font-size: var(--text-sm); line-height: 1.7; }
.page h1 { font-family: var(--font-display); font-size: var(--text-3xl); line-height: 1.15; margin: 0 0 var(--space-4); }
.page h2 { font-family: var(--font-display); font-size: var(--text-lg); margin: var(--space-6) 0 var(--space-3); color: var(--color-primary); }
.page p { margin: 0 0 var(--space-3); }
</style>
</head>
<body>

<section class="page">
  <h1>One-pager title</h1>
  <p style="color: var(--color-text-muted);">Lead paragraph — the single message this page exists to deliver.</p>
  <h2>Section</h2>
  <p>Content must fit within one A4 page; overflow is clipped. If it cannot
  fit, add a second <code>&lt;section class="page"&gt;</code> (front/back).</p>
</section>

</body>
</html>
